version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: safebucket
build:
  toolchains: []
  run_buildscript: false
images:
  - id: safebucket
    target: service
    service: safebucket
    source: safebucket/safebucket
    channel: stable
    sort: semver
    tag_regex: ^v?[0-9]+[.][0-9]+[.][0-9]+$
    delivery:
      mode: mirror
      require_digest_match: true
  - id: rustfs
    target: service
    service: rustfs
    source: rustfs/rustfs
    channel: custom
    sort: semver
    tag_regex: ^1[.]0[.][0-9]+$
    version_regex: ^(?P<version>1[.]0[.][0-9]+)$
    version_template: "{version}"
    delivery:
      mode: mirror
      require_digest_match: true
  - id: bucket-init
    target: service
    service: bucket-init
    source: amazon/aws-cli
    channel: custom
    sort: semver
    tag_regex: ^2[.][0-9]+[.][0-9]+$
    version_regex: ^(?P<version>2[.][0-9]+[.][0-9]+)$
    version_template: "{version}"
    delivery:
      mode: mirror
      require_digest_match: true
release:
  use_github_release_notes: true
  store_changelog_format: plain
stores:
  official:
    enabled: false
  private:
    enabled: false
    name: safebucket
    skip_if_version_exists: true
